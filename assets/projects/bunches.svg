<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#1E293B"/>
  <!-- subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#334155"/>
  </pattern>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <!-- accent bar -->
  <rect x="0" y="0" width="1600" height="4" fill="#34D399"/>
  <!-- icon circle -->
  <circle cx="800" cy="370" r="60" fill="none" stroke="#34D399" stroke-width="3" opacity="0.4"/>
  <circle cx="800" cy="370" r="12" fill="#34D399" opacity="0.8"/>
  <!-- label -->
  <text x="800" y="480" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="700" fill="#F1F5F9" text-anchor="middle">Bunches</text>
  <text x="800" y="540" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#64748B" text-anchor="middle">[ screenshot placeholder ]</text>
</svg>
