<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#1E293B"/>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#334155"/>
  </pattern>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect x="0" y="0" width="1600" height="4" fill="#34D399"/>

  <!-- proximity rings around "you" -->
  <g fill="none" stroke="#34D399">
    <circle cx="800" cy="360" r="90" stroke-width="3" opacity="0.55"/>
    <circle cx="800" cy="360" r="170" stroke-width="2" opacity="0.32"/>
    <circle cx="800" cy="360" r="250" stroke-width="2" opacity="0.16"/>
  </g>
  <circle cx="800" cy="360" r="16" fill="#34D399"/>
  <circle cx="800" cy="360" r="30" fill="#34D399" opacity="0.18"/>

  <!-- people nearby -->
  <g fill="#F1F5F9">
    <circle cx="868" cy="302" r="11"/>
    <circle cx="726" cy="410" r="11"/>
    <circle cx="930" cy="455" r="9" opacity="0.75"/>
    <circle cx="655" cy="250" r="9" opacity="0.75"/>
    <circle cx="1010" cy="270" r="7" opacity="0.45"/>
    <circle cx="590" cy="470" r="7" opacity="0.45"/>
  </g>
  <!-- a group forming -->
  <g stroke="#F1F5F9" stroke-width="2" opacity="0.5">
    <line x1="800" y1="360" x2="868" y2="302"/>
    <line x1="800" y1="360" x2="726" y2="410"/>
  </g>

  <text x="800" y="715" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="700" fill="#F1F5F9" text-anchor="middle">Bunches</text>
  <text x="800" y="770" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Who's nearby, right now</text>
</svg>
