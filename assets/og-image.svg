<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- subtle grid -->
  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#10b981"/>
  <!-- name -->
  <text x="100" y="280" font-family="system-ui,-apple-system,sans-serif" font-size="84" font-weight="800" fill="#f1f5f9" letter-spacing="-2">Tuan Doan</text>
  <!-- tagline -->
  <text x="100" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="32" fill="#10b981" font-weight="700" letter-spacing="2">SOFTWARE ENGINEER · BAY AREA</text>
  <!-- domain hint -->
  <text x="100" y="530" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#475569">tuandoancsus.github.io</text>
  <!-- decorative circle -->
  <circle cx="1050" cy="315" r="200" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.15"/>
  <circle cx="1050" cy="315" r="140" fill="none" stroke="#10b981" stroke-width="1" opacity="0.1"/>
</svg>
